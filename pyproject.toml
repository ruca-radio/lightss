[project]
name = "lightss"
version = "0.1.0"
description = "Agentic AI WLED light controller with browser music mode and MCP tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2 ; python_full_version >= '3.13'",
    "numpy>=1.26,<2.0",
    "pydub>=0.25,<0.26",
    "shazamio==0.2.0.0",
    "sounddevice>=0.5,<0.6",
    "websockets>=12",
]

[project.scripts]
lightss = "light_gui:main"
light-gui = "light_gui:main"
lightctl = "lightctl:main"
mcp-light = "mcp_light:main"
light-tray = "light_tray:main"

[project.optional-dependencies]
dev = [
    "pytest>=7,<10",
]

[tool.setuptools]
py-modules = [
    "actions",
    "ai_chat",
    "atmospheres",
    "audio_player",
    "color_lab",
    "columns",
    "dynamic_scenes",
    "effect_metadata",
    "firetv",
    "fleet",
    "light_gui",
    "light_gui_html",
    "light_tray",
    "lightctl",
    "look_agents",
    "look_memory",
    "main",
    "mcp_light",
    "mood_orchestrator",
    "music_director",
    "music_recognizer",
    "palette_lab",
    "realtime",
    "shows",
    "wled_ws",
    "youtopia_bridge",
    "youtopia_daemon",
]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["wled-logo.png"]
